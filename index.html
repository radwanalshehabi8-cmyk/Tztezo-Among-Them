async function joinRoom(id) {
  if (!(await fbInit())) { toast(NET.err); return; }
  netReset(); NET.role = 'client'; NET.id = id; S.join = { msg: 'بانتظار موافقة رئيس الغرفة…', id }; show('wait');
  try {
    rr('to/' + S.uid).remove(); rr('up/' + S.uid).remove(); rr('acc/' + S.uid).remove();
    await rr('req/' + S.uid).set({ name: S.name, color: S.color, t: Date.now() });
  } catch (e) { netReset(); if (!rulesError(e)) toast('تعذّر الاتصال بالغرفة'); show('home'); return; }
  rr('req/' + S.uid).onDisconnect().remove();
  const h = s => {
    const v = s.val(); if (!v) return;
    if (!v.ok) { netReset(); S.join = null; toast(v.why || 'The host declined your request'); show('home'); return; }
    rr('acc/' + S.uid).off('value', h); enterRoom(v);
  };
  watch(rr('acc/' + S.uid), 'value', h);
  watch(R('idx/' + id), 'value', s => { if (!s.val() && NET.role === 'client' && !NET.hostCh) { netReset(); S.join = null; toast('The room was closed'); show('home'); } });
  setTimeout(() => { if (NET.role === 'client' && !NET.hostCh && NET.id === id) { netReset(); S.join = null; toast('The host did not answer'); show('home'); } }, 90000);
}
function enterRoom(v) {
  S.me = v.id; NET.accT = v.t; NET.hostCh = true; NET.lastIn = _now(); S.join = null;
  watch(rr('ev'), 'child_added', s => { const v = s.val(); if (v && v.t >= NET.accT - 1500) clientGot(v.m); });
  watch(rr('to/' + S.uid), 'child_added', s => { const m = s.val(); s.ref.remove(); if (m) clientGot(m); });
  watch(rr('s'), 'value', s => { const m = s.val(); if (m) clientGot(m); });
  watch(R('idx/' + NET.id + '/hb'), 'value', () => { NET.lastIn = _now(); });
  rr('up/' + S.uid).onDisconnect().set({ gone: 1 });
  startBeat();
}
function clientGot(m) {
  NET.lastIn = _now();

}

/* ---------- lobby (host) ---------- */

/* ---------- start ---------- */

/* ---------- snapshots ---------- */
function snapObj() {

    b: S.bodies.map(b => [b.id, Math.round(b.x), Math.round(b.y)]), tp: S.prog, sab: S.sab ? { t: S.sab.t, end: S.sab.end, ok: S.sab.ok } : 0, it: S.phase === 'intro' ? S.introEnd : 0 };

/* ---------- host message handling ---------- */
function hostMsg(pid, m) {
  const p = P[pid]; if (!p) return;
  switch (m.k) {
    case 'pos':

      if (pid !== S.me && (m.e | 0) !== (p.ep | 0)) break;
      if (pid !== S.me) { p.x = clamp(m.x, 0, WW); p.y = clamp(m.y, 0, WH); p.fx = m.f < 0 ? -1 : 1; p.mv = m.m ? 1 : 0; }
      break;
    case 'bye': if (pid !== S.me) playerLeft(pid); break;
    case 'color': if (S.phase === 'lobby') { const c = +m.c; if (c >= 0 && c < 15 && !players().some(q => q.color === c)) { p.color = c; sendLobby(); } } break;

function doKill(kid, vid) {

function nearStation(p, sid, r) { const s = ST[sid]; return s && dist(p.x, p.y, s.x, s.y) <= (r || 140); }

}

/* ---------- sabotage ---------- */

/* ---------- win ---------- */
function checkWin() {

  if (imps === 0) { endGame('crew', 'Every Tztezo has been removed'); return true; }

    case 'me': { const old = S.mine; S.mine = { role: m.role, tasks: m.tasks, imps: m.imps || [], killEnd: m.killEnd, sabEnd: m.sabEnd, meetings: m.meetings }; if (!isHost() && P[S.me]) P[S.me].role = m.role; uiHud(); if (S.phase === 'intro') showSplash(); break; }

  const up = type === 'upload', T = mkTimers(); b.innerHTML = '<p class="dim">' + (up ? 'Upload the collected data to HQ.' : 'Download the data. Stay close until it finishes.') + '</p><div class="bar big"><i id="xf"></i></div><p id="xfT" class="dim">0%</p><button class="btn primary" id="xfB">' + (up ? 'UPLOAD' : 'DOWNLOAD') + '</button>';
  const bt = $('#xfB'); bt.addEventListener('click', () => { bt.disabled = true; const t0 = performance.now(); T.add(() => { const p = clamp((performance.now() - t0) / 5500, 0, 1); $('#xf').style.width = p * 100 + '%'; $('#xfT').textContent = Math.floor(p * 100) + '%'; if (p >= 1) { T.clear(); sfx.ding(); done(); } }, 60); });
  return () => T.clear();
}
function miniSample(b, done) {
  const T = mkTimers(); b.innerHTML = '<p id="smM" class="dim">Press start to analyse the sample.</p><div class="bar big"><i id="smF"></i></div><div class="vials" id="vl"></div><button class="btn primary" id="smB">START</button>';
  $('#smB').addEventListener('click', () => { $('#smB').hidden = true; $('#smM').textContent = 'Analysing…'; const t0 = performance.now(); T.add(() => { const p = clamp((performance.now() - t0) / 4500, 0, 1); $('#smF').style.width = p * 100 + '%'; if (p >= 1) { T.clear(); pick(); } }, 60); });
  const pick = () => { $('#smM').textContent = 'Anomaly detected — tap the odd vial.'; const odd = ri(0, 4), hue = ri(0, 360); $('#vl').innerHTML = [...Array(5)].map((_, i) => '<button data-i="' + i + '" style="background:hsl(' + (i === odd ? (hue + 40) % 360 : hue) + ',70%,' + (i === odd ? 62 : 52) + '%)"></button>').join('');
    $$('#vl button').forEach(v => v.addEventListener('click', () => { if (+v.dataset.i === odd) { sfx.ding(); done(); } else { $('#smM').textContent = 'Wrong vial! Run it again.'; $('#vl').innerHTML = ''; $('#smB').hidden = false; $('#smF').style.width = '0'; } })); };
  return () => T.clear();
}
function miniScan(b, done) {
  const T = mkTimers(); b.innerHTML = '<p class="dim">Stand still and hold the button while scanning.</p><div class="scanner"><div class="beam" id="beam"></div></div><div class="bar big"><i id="scF"></i></div><button class="btn primary hold" id="scB">HOLD TO SCAN</button>';
  let t0 = 0, id = 0; const bt = $('#scB');
  const start = () => { t0 = performance.now(); $('#beam').classList.add('on'); id = setInterval(() => { const p = clamp((performance.now() - t0) / 6000, 0, 1); $('#scF').style.width = p * 100 + '%'; if (p >= 1) { clearInterval(id); sfx.ding(); done(); } }, 60); };
  const stop = () => { clearInterval(id); $('#beam') && $('#beam').classList.remove('on'); $('#scF') && ($('#scF').style.width = '0'); };
  bt.addEventListener('pointerdown', e => { bt.setPointerCapture(e.pointerId); start(); }); bt.addEventListener('pointerup', stop); bt.addEventListener('pointercancel', stop);
  return () => { clearInterval(id); };
}
/* sabotage fix panels */
function openFix(kind, i) {
  if (kind === 'reactor') return openMini('Reactor Meltdown', b => {
    b.innerHTML = '<p class="dim">Two crewmates must hold the panels at the same time!</p><p id="rhS" class="warn"></p><button class="btn danger hold" id="rhB">HOLD</button>'; let iv = 0; const bt = $('#rhB');
    const st = setInterval(() => { const e = $('#rhS'); if (e && S.sab) e.textContent = 'Panel A: ' + (S.sab.ok[0] ? 'HELD' : '—') + '   Panel B: ' + (S.sab.ok[1] ? 'HELD' : '—'); }, 200);
    const on = () => { sendC({ k: 'hold', i, on: 1 }); iv = setInterval(() => sendC({ k: 'hold', i, on: 1 }), 350); }; const off = () => { clearInterval(iv); sendC({ k: 'hold', i, on: 0 }); };
    bt.addEventListener('pointerdown', e => { bt.setPointerCapture(e.pointerId); on(); }); bt.addEventListener('pointerup', off); bt.addEventListener('pointercancel', off);
    return () => { clearInterval(st); off(); };
  }, true);
  if (kind === 'o2') return openMini('O2 — enter code', b => {
    const code = String(ri(10000, 99999)); let cur = ''; b.innerHTML = '<p class="dim">Enter the code shown.</p><div class="code">' + code + '</div><div class="disp" id="dsp">_____</div><div class="keys">' + '123456789C0⌫'.split('').map(k => '<button data-k="' + k + '">' + k + '</button>').join('') + '</div>';
    $$('.keys button').forEach(k => k.addEventListener('click', () => { const v = k.dataset.k; sfx.click(); if (v === 'C' || v === '⌫') cur = v === 'C' ? '' : cur.slice(0, -1); else if (cur.length < 5) cur += v; $('#dsp').textContent = cur.padEnd(5, '_'); if (cur.length === 5) { if (cur === code) { sendC({ k: 'fix', t: 'o2', i }); sfx.ding(); closeMini(); } else { $('#dsp').textContent = 'WRONG'; cur = ''; } } }));
  }, true);
  if (kind === 'lights') return openMini('Fix Lights', b => {
    const sw = [...Array(5)].map(() => Math.random() < .5); if (sw.every(Boolean)) sw[0] = false; b.innerHTML = '<p class="dim">Flip every switch up.</p><div class="switches">' + sw.map((v, k) => '<button class="swt' + (v ? ' up' : '') + '" data-k="' + k + '"><i></i></button>').join('') + '</div>';
    $$('.swt').forEach(e => e.addEventListener('click', () => { const k = +e.dataset.k; sw[k] = !sw[k]; e.classList.toggle('up', sw[k]); sfx.click(); if (sw.every(Boolean)) { sendC({ k: 'fix', t: 'lights', i }); sfx.ding(); closeMini(); } }));
  }, true);
  if (kind === 'comms') return openMini('Restore Comms', b => {
    const tg = [ri(15, 85), ri(15, 85)]; b.innerHTML = '<p class="dim">Match both sliders to the markers.</p>' + tg.map((t, k) => '<div class="slw"><i style="left:' + t + '%"></i><input type="range" min="0" max="100" value="' + (t > 50 ? 5 : 95) + '" data-k="' + k + '"></div>').join('');
    const chk = () => { const v = $$('.slw input').map(x => +x.value); if (v.every((x, k) => Math.abs(x - tg[k]) <= 3)) { sendC({ k: 'fix', t: 'comms', i }); sfx.ding(); closeMini(); } }; $$('.slw input').forEach(x => x.addEventListener('input', chk));
  }, true);
}
function openCams() {
  openMini('Security Cameras', b => {
    b.innerHTML = '<div class="camgrid">' + CAMS.map((c, i) => '<canvas width="280" height="190" data-i="' + i + '"></canvas>').join('') + '</div>';
    const cs = $$('.camgrid canvas'); MINI.tick = t => cs.forEach(c => drawCam(c, CAMS[+c.dataset.i], t));

}
function openAdmin() {
  openMini('Admin Table', b => {
    b.innerHTML = '<canvas id="adm" width="640" height="420" class="admc"></canvas><p class="dim small">Live positions of everyone alive.</p>';
    const c = $('#adm'); MINI.tick = () => { if (S.sab && S.sab.t === 'comms') { const g = c.getContext('2d'); g.fillStyle = '#111'; g.fillRect(0, 0, c.width, c.height); g.fillStyle = '#fff'; g.font = 'bold 28px system-ui'; g.textAlign = 'center'; g.fillText('OFFLINE', c.width / 2, c.height / 2); } else drawMapCanvas(c, 'admin'); };
  });

function openMap() { openMini('Map', b => { b.innerHTML = '<canvas id="bm" width="640" height="420" class="admc"></canvas>'; const c = $('#bm'); MINI.tick = () => drawMapCanvas(c, 'map'); }); }
function openSabMenu() {
  if (S.sab) return toast('A sabotage is already active'); if (S.mine.sabEnd > Date.now()) return toast('Sabotage is recharging');
  openMini('Sabotage', b => { b.innerHTML = '<div class="sabl">' + Object.entries(SAB).map(([k, d]) => '<button class="btn danger" data-act="sabGo" data-arg="' + k + '">' + d.n + '</button>').join('') + '</div>'; });
}

/* ---------- meeting UI ---------- */
function uiMeet() {
  const el = $('#meet'), M = S.meet; if (!M || S.phase !== 'meeting') { el.hidden = true; return; }
  el.hidden = false; const v = me(), alive = v && v.alive, voted = M.voted || [], canVote = alive && M.ph === 'vote' && !voted.includes(S.me);
  const title = M.ph === 'disc' ? 'DISCUSS' : M.ph === 'vote' ? 'WHO IS THE TZTEZO?' : 'RESULTS';
  const cl = P[M.caller], head = (M.body >= 0 ? '💀 ' + (cl ? cl.name : '?') + ' found a body' : '🚨 ' + (cl ? cl.name : '?') + ' called a meeting');
  let h = `<div class="mh"><div><h2>${title}</h2><small>${esc(head)}</small></div><div class="tm" id="mTimer">${mmss(M.end - Date.now())}</div></div><div class="mgrid">`;
  players().filter(p => !p.left).forEach(p => {
    const dots = M.ph === 'res' ? Object.entries(M.votes).filter(([, t]) => t === p.id).map(([id]) => '<u style="background:' + COLORS[P[id].color][1] + '"></u>').join('') : '';
    h += `<button class="mc${p.alive ? '' : ' dead'}${voted.includes(p.id) && M.ph === 'vote' ? ' vd' : ''}${M.myVote === p.id ? ' mine' : ''}" ${canVote && p.alive ? 'data-act="vote" data-arg="' + p.id + '"' : 'disabled'}>${faceImg(p.color, !p.alive)}<span>${esc(p.name)}${p.id === S.me ? ' (you)' : ''}</span>${voted.includes(p.id) && M.ph === 'vote' ? '<em>VOTED</em>' : ''}<div class="dots">${dots}</div></button>`;
  });
  h += '</div>';
  if (M.ph === 'vote') h += `<button class="btn ${M.myVote === -1 ? 'primary' : 'ghost'}" ${canVote ? 'data-act="vote" data-arg="-1"' : 'disabled'}>SKIP VOTE</button>`;
  if (M.ph === 'res') {
    const sk = Object.values(M.votes).filter(t => t === -1).length, e = P[M.ej];
    h += `<div class="eject"><div class="stars"></div>${e ? '<img class="ejf" src="' + faceURL(e.color) + '" alt="">' : ''}<div class="ejt">${e ? esc(e.name) + (M.imp ? ' was a TZTEZO.' : ' was not a Tztezo.') : (M.tie ? 'Nobody was ejected (tie).' : 'Nobody was ejected (skipped).')}<small>${sk} skipped</small></div></div>`;
  }
  h += '<div class="chat"><div id="chatLog" class="clog"></div><form id="chatF"><input id="chatIn" maxlength="120" placeholder="' + (alive ? 'Say something…' : 'Ghost chat…') + '" autocomplete="off"><button class="btn primary">Send</button></form></div>';
  const keep = $('#chatIn') ? $('#chatIn').value : ''; const foc = document.activeElement && document.activeElement.id === 'chatIn';
  el.innerHTML = h; if (keep) $('#chatIn').value = keep; if (foc) $('#chatIn').focus(); uiChat();
}
function uiChat() {
  const l = $('#chatLog'); if (!l) return; l.innerHTML = S.chat.map(m => { const p = P[m.id]; return '<div class="cm' + (m.d ? ' gh' : '') + '"><b style="color:' + (p ? COLORS[p.color][1] : '#fff') + '">' + esc(p ? p.name : '?') + (m.d ? ' (ghost)' : '') + ':</b> ' + esc(m.t) + '</div>'; }).join(''); l.scrollTop = l.scrollHeight;
}
function uiEnd() {
  const e = S.end; if (!e) return; const el = $('#end'), imp = S.mine.role === 'i', won = (e.w === 'imp') === imp;
  el.hidden = false; el.className = 'end ' + (e.w === 'imp' ? 'imp' : 'crew');
  el.innerHTML = `<h1>${e.w === 'imp' ? 'TZTEZOS WIN' : 'CREWMATES WIN'}</h1><p class="${won ? 'ok' : 'bad'}">${won ? 'VICTORY' : 'DEFEAT'}</p><p class="dim">${esc(e.why)}</p>
    <div class="mgrid">${players().filter(p => !p.left || true).map(p => `<div class="mc${e.roles[p.id] === 'i' ? ' tz' : ''}">${faceImg(p.color, !p.alive)}<span>${esc(p.name)}</span><em>${e.roles[p.id] === 'i' ? 'TZTEZO' : 'CREW'}</em></div>`).join('')}</div>
    ${isHost() ? '<button class="btn primary" data-act="backLobby">BACK TO LOBBY</button>' : '<p class="dim">Waiting for the host…</p>'}`;
  (won ? sfx.win : sfx.lose)();
}

/* ---------- input ---------- */
const INP = { x: 0, y: 0, kx: 0, ky: 0 };
(() => {
  const z = document.getElementById('joy'), base = document.getElementById('jbase'), knob = document.getElementById('jknob'); let id = null, ox = 0, oy = 0;
  z.addEventListener('pointerdown', e => { if (id !== null) return; id = e.pointerId; z.setPointerCapture(id); ox = e.clientX; oy = e.clientY; base.style.left = ox + 'px'; base.style.top = oy + 'px'; base.classList.add('on'); knob.style.transform = 'translate(0,0)'; audio(); });
  z.addEventListener('pointermove', e => { if (e.pointerId !== id) return; let dx = e.clientX - ox, dy = e.clientY - oy; const d = Math.hypot(dx, dy), m = 52; if (d > m) { dx = dx / d * m; dy = dy / d * m; } knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)'; INP.x = Math.abs(dx) / m < .12 ? 0 : dx / m; INP.y = Math.abs(dy) / m < .12 ? 0 : dy / m; });
  const up = e => { if (e.pointerId !== id) return; id = null; INP.x = INP.y = 0; base.classList.remove('on'); };
  z.addEventListener('pointerup', up); z.addEventListener('pointercancel', up);
  const K = { ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0], ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1] }, down = {};
  const rk = () => { INP.kx = INP.ky = 0; Object.keys(down).forEach(k => { if (down[k] && K[k]) { INP.kx += K[k][0]; INP.ky += K[k][1]; } }); };
  addEventListener('keydown', e => { if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return; const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; if (K[k]) { down[k] = 1; rk(); e.preventDefault(); }
    if (S.screen !== 'game' || MINI.open || S.phase !== 'play') return; if (k === 'e' || k === ' ') $('#bUse').click(); if (k === 'q') $('#bKill').click(); if (k === 'r') $('#bReport').click(); if (k === 'm') openMap(); });
  addEventListener('keyup', e => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; if (K[k]) { down[k] = 0; rk(); } });
})();

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return; const a = t.dataset.act, arg = t.dataset.arg; audio();
  switch (a) {
    case 'host': { const n = ($('#nameIn').value || '').trim(); if (!n) return toast('اكتب اسمك أولاً'); S.name = n.slice(0, 12); lsSet('tz.name', S.name); const rn = ($('#roomIn').value || '').trim(); t.disabled = true; hostCreate(rn).then(ok => { t.disabled = false; if (ok) { sendLobby(); show('lobby'); } }); break; }
    case 'joinRoom': { const n = ($('#nameIn').value || '').trim(); if (!n) return toast('اكتب اسمك أولاً'); S.name = n.slice(0, 12); lsSet('tz.name', S.name); joinRoom(arg); break; }
    case 'acc': acceptReq(arg, true); break;
    case 'dec': acceptReq(arg, false); break;
    case 'leave': leaveRoom(); break;
    case 'copyRules': try { navigator.clipboard.writeText(RULES_TXT); toast('تم النسخ'); } catch (e) { toast('انسخها يدوياً'); } break;
    case 'closeOv': { const o = document.getElementById('ov'); if (o) o.hidden = true; break; }
    case 'cfg': { const [k, d] = arg.split(':'); setCfg(k, S.cfg[k] + +d); break; }
    case 'color': setMyColor(arg); break;
    case 'start': startGame(); break;
    case 'backLobby': $('#end').hidden = true; backToLobby(); break;
    case 'use': break;
    case 'miniClose': closeMini(); break;
    case 'map': openMap(); break;
    case 'sabMenu': openSabMenu(); break;
    case 'sabGo': closeMini(); sendC({ k: 'sab', t: arg }); break;
    case 'ventGo': sendC({ k: 'vent', a: 'go', i: +arg }); break;
    case 'ventExit': sendC({ k: 'vent', a: 'exit' }); break;
    case 'vote': { const id = +arg; if (S.meet && S.meet.myVote == null) { S.meet.myVote = id; sendC({ k: 'vote', t: id }); uiMeet(); } break; }
  }
});
$('#bUse').addEventListener('click', () => { const b = $('#bUse'); if (b._run) b._run(); });
$('#bReport').addEventListener('click', () => { const b = bodyNear(); if (b) sendC({ k: 'report', id: b.id }); });
$('#bKill').addEventListener('click', () => { const b = $('#bKill'), t = killTarget(); if (t && S.mine.killEnd <= Date.now()) sendC({ k: 'kill', v: t.id }); else if (S.mine.killEnd > Date.now()) toast('Kill is recharging'); else toast('Nobody in range'); });
$('#bVent').addEventListener('click', () => sendC({ k: 'vent', a: 'enter' }));
$('#bSab').addEventListener('click', openSabMenu);
$('#bMap').addEventListener('click', openMap);
document.addEventListener('submit', e => { if (e.target.id === 'chatF') { e.preventDefault(); const i = $('#chatIn'); if (i.value.trim()) { sendC({ k: 'chat', t: i.value.trim() }); i.value = ''; } } });
/* make sure tapping a text field always opens the phone keyboard */
document.addEventListener('pointerup', e => { const t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA') && document.activeElement !== t) { try { t.focus(); } catch (x) {} } }, true);
/* fullscreen toggle */
(() => {
  const b = document.getElementById('fsBtn'), de = document.documentElement;
  const isFs = () => document.fullscreenElement || document.webkitFullscreenElement;
  if (!(de.requestFullscreen || de.webkitRequestFullscreen)) { b.hidden = true; return; }
  b.addEventListener('click', async () => {
    try {
      if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
      else { await (de.requestFullscreen || de.webkitRequestFullscreen).call(de); try { screen.orientation && screen.orientation.lock && await screen.orientation.lock('landscape'); } catch (e) {} }
    } catch (e) { toast('Fullscreen is not available in this browser'); }
  });
  const upd = () => { b.textContent = isFs() ? '✕' : '⛶'; setTimeout(resize, 200); };
  document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd);
})();

/* ===================== main loop + boot ===================== */
let lastTs = 0, lastPos = 0, lastX = 0, lastY = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (ts - lastTs) / 1000 || 0), t = ts / 1000; lastTs = ts;
  if (S.screen !== 'game') return;
  const v = me();
  if (v) {
    const canMove = S.phase === 'play' && !MINI.open && v.vent < 0;
    let ix = INP.x + INP.kx, iy = INP.y + INP.ky; const m = Math.hypot(ix, iy); if (m > 1) { ix /= m; iy /= m; }
    if (canMove && m > .01) {
      const sp = BASE_SPEED * S.cfg.speed, dx = ix * sp * dt, dy = iy * sp * dt;
      if (v.alive) [v.x, v.y] = slide(v.x, v.y, dx, dy); else { v.x = clamp(v.x + dx, 20, WW - 20); v.y = clamp(v.y + dy, 20, WH - 20); }
      if (Math.abs(ix) > .1) v.fx = ix > 0 ? 1 : -1; v.mv = 1;
    } else v.mv = 0;
    v.rx = v.x; v.ry = v.y;
    if (!isHost() && NET.hostCh) { const mv = v.mv || v.x !== lastX || v.y !== lastY, gap = mv ? 110 : 2000; if (ts - lastPos > gap) { lastPos = ts; lastX = v.x; lastY = v.y; clientSend({ k: 'pos', x: Math.round(v.x), y: Math.round(v.y), f: v.fx, m: v.mv, e: S.ep || 0 }); } }
    const k = 1 - Math.exp(-dt * 14);
    players().forEach(p => { if (p.id === S.me) return; if (dist(p.rx, p.ry, p.x, p.y) > 250) { p.rx = p.x; p.ry = p.y; } else { p.rx += (p.x - p.rx) * k; p.ry += (p.y - p.ry) * k; } });
  }
  hudTick(t);
  if (S.phase !== 'meeting') drawScene(t, dt);
  if (MINI.tick) MINI.tick(t);
}
function boot() { resize(); requestAnimationFrame(frame); show('home'); }
document.addEventListener('contextmenu', e => { if (S.screen === 'game') e.preventDefault(); });
boot();
